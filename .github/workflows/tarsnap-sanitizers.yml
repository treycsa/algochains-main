name: Tarsnap sanitizer sweep

on:
  push:
    paths:
      - '.github/workflows/tarsnap-sanitizers.yml'
  workflow_dispatch:

jobs:
  kivaloo-asan-ubsan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Clone current Kivaloo
        run: |
          git clone --depth 1 https://github.com/Tarsnap/kivaloo.git
          cd kivaloo
          git rev-parse HEAD

      - name: Build with AddressSanitizer and UBSan
        run: |
          cd kivaloo
          export CC=clang
          export CFLAGS='-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer'
          export LDFLAGS='-fsanitize=address,undefined'
          make -j2

      - name: Run every test family and keep collecting diagnostics
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=0:abort_on_error=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=0
        run: |
          cd kivaloo
          export CC=clang
          export CFLAGS='-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer'
          export LDFLAGS='-fsanitize=address,undefined'
          for D in lbs kvlds mux s3 kvlds-s3 kvlds-ddbkv onlinequantile; do
            echo "===== SANITIZER_SUITE:$D ====="
            make -C "tests/$D" test || echo "===== TEST_FAILED:$D ====="
          done
          echo "===== SANITIZER_SWEEP_COMPLETE ====="
