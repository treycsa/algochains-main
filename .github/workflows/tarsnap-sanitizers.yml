name: Tarsnap sanitizer sweep

on:
  push:
    paths:
      - '.github/workflows/tarsnap-sanitizers.yml'
  workflow_dispatch:

jobs:
  kivaloo-asan-ubsan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone current Kivaloo
        run: |
          git clone --depth 1 https://github.com/Tarsnap/kivaloo.git
          cd kivaloo
          git rev-parse HEAD

      - name: Build with AddressSanitizer and UBSan
        run: |
          cd kivaloo
          export CC=clang
          export CFLAGS='-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer'
          export LDFLAGS='-fsanitize=address,undefined'
          make -j2

      - name: Run project tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          cd kivaloo
          export CC=clang
          export CFLAGS='-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer'
          export LDFLAGS='-fsanitize=address,undefined'
          make test
