name: Tarsnap multi-repo sanitizer sweep

on:
  push:
    paths:
      - '.github/workflows/tarsnap-multirepo-sanitizers.yml'
  workflow_dispatch:

jobs:
  sanitizer:
    strategy:
      fail-fast: false
      matrix:
        repo: [spiped, scrypt]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Clone target
        run: |
          git clone --depth 1 "https://github.com/Tarsnap/${{ matrix.repo }}.git" target
          cd target
          git rev-parse HEAD

      - name: Build under ASan and UBSan
        run: |
          cd target
          export CC=clang
          export CFLAGS='-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer'
          if [ "${{ matrix.repo }}" = "scrypt" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq autoconf-archive libtool
            autoreconf -i
            ./configure CC=clang CFLAGS="$CFLAGS" LDFLAGS='-fsanitize=address,undefined'
            make -j2
          else
            make -j2 CC=clang CFLAGS="$CFLAGS" LDADD_EXTRA='-fsanitize=address,undefined'
          fi

      - name: Run tests and collect sanitizer diagnostics
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=0:abort_on_error=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=0
        run: |
          cd target
          if [ "${{ matrix.repo }}" = "scrypt" ]; then
            make test || true
          else
            make test CC=clang CFLAGS='-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer' LDADD_EXTRA='-fsanitize=address,undefined' || true
          fi
          echo "===== SANITIZER_SWEEP_COMPLETE:${{ matrix.repo }} ====="
